[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rotorfault"
version = "0.1.0"
description = "Detect, isolate, recover: rotor-fault tolerance for a 5-inch quadrotor (simulation study)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rami Kronbi" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# PX4 ULog reading (rotorfault.logs.ulog); the tests read a small SITL ULog excerpt
px4 = ["pyulog>=1.0"]
# running the PX4 SITL campaign in sitl/ (also needs PX4-Autopilot and Gazebo Harmonic)
sitl = ["pyulog>=1.0", "pymavlink>=2.4"]
dev = ["pytest>=7", "ruff>=0.4", "pyulog>=1.0"]

[project.scripts]
rotorfault = "rotorfault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rotorfault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments", "sitl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "B905"]
