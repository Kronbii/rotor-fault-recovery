name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests experiments
          ruff format --check src tests experiments
      - name: Pytest
        run: python -m pytest
      - name: Smoke experiment (quick version of the whole pipeline)
        run: |
          mkdir -p build/smoke
          ROTORFAULT_ROOT=build/smoke ROTORFAULT_WORKERS=2 python -m rotorfault experiments --quick
          ROTORFAULT_ROOT=build/smoke python -m rotorfault simulate --loe 1.0 --duration 6
